name: Update Dashboard Data

on:
  schedule:
    # Hourly 9am–3pm AEST (23:00–05:00 UTC), NHL season only (Oct–Apr)
    # 23 UTC = 9am AEST next day; stops at 05 UTC = 3pm AEST
    # No later runs -- Yahoo rolls over ~07 UTC (midnight US Pacific) causing bad data
    - cron: "0 23 * 1-4,10-12 *"
    - cron: "0 0,1,2,3,4,5 * 1-4,10-12 *"
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: write    # needed to commit data.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Yahoo data for the current season
        # Reads the league's public feed (pub-api-ro.fantasysports.yahoo.com) -- no OAuth,
        # no secrets. The league must stay publicly viewable. League key comes from
        # docs/league_keys.json. The old YAHOO_* secrets are no longer used.
        env:
          GITHUB_REPOSITORY:   ${{ github.repository }}
        run: python scripts/fetch_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "PWW Bot"
          git config user.email "pww-bot@users.noreply.github.com"
          git add docs/data.json docs/data-*.json docs/seasons.json
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

